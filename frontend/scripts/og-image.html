<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG image source</title>
<style>
  @font-face {
    font-family: 'Instrument Serif';
    font-style: normal;
    font-weight: 400;
    src: url('../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Instrument Serif';
    font-style: italic;
    font-weight: 400;
    src: url('../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2') format('woff2');
  }
  @font-face {
    font-family: 'JetBrains Mono';
    font-style: normal;
    font-weight: 500;
    src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2') format('woff2');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  .card {
    width: 1200px;
    height: 630px;
    background: #F3F5F2; /* --bg, light theme "paper" ground */
    color: #131A16;      /* --ink */
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 96px 100px;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 20px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #5D6B62; /* --muted */
    margin-bottom: 28px;
  }

  .name {
    font-family: 'Instrument Serif', Georgia, serif;
    font-weight: 400;
    font-size: 116px;
    line-height: 1.02;
    letter-spacing: -0.02em;
  }

  .name em {
    font-style: italic;
    color: #14563C; /* --accent */
  }

  .rule {
    width: 88px;
    height: 3px;
    background: #14563C;
    margin-top: 44px;
    margin-bottom: 44px;
  }

  .domain {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 20px;
    letter-spacing: 0.04em;
    color: #5D6B62;
  }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Full-stack developer</p>
    <h1 class="name">Anastasiia <em>Horbachova</em></h1>
    <div class="rule"></div>
    <p class="domain">horbachov.com</p>
  </div>
</body>
</html>
